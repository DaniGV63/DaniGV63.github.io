name: Refresh Energinet data

on:
  schedule:
    # Every day; the API publishes settlement data with a delay of a few days.
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-energinet
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/energinet/requirements.txt
      - name: Install dependencies
        run: pip install -r pipeline/energinet/requirements.txt
      - name: Run the tests
        run: python -m pytest pipeline/tests/test_energinet.py -q
      - name: Download data and rebuild the JSON
        run: python pipeline/energinet/build_energinet_data.py --refresh
      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet -- src/data/energinet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/energinet
          git commit -m "data: refresh Energinet data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Commits pushed with the default token do not start other workflows,
      # so the site is deployed explicitly.
      - name: Deploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
